name: CI

# ---------------------------------------------------------------------------
# Scope
#   Cross-compilation validation for PublishAotCross.Tools.
#
# Important constraints
#   * The XWin.Store.* package content (the filtered Windows SDK/CRT store) is
#     gitignored and is produced by maintainers with toolsets/download-xwin-store.ps1.
#     CI therefore CANNOT rebuild the XWin.Store.* / LLD.Link.Toolsets.* packages;
#     those must already be published, and CI restores them from the feeds.
#   * The main PublishAotCross.Tools package IS built by CI from source (packed
#     into the local ./artifacts feed under a synthetic version), so no NuGet
#     push of the main package is needed to validate changes.
#
# Publishing
#   This workflow does NOT publish packages. Packing and pushing (NuGet.org /
#   GitHub Packages) is done manually by maintainers, once the toolset packages
#   for the current revision are available.
# ---------------------------------------------------------------------------

on:
  pull_request:
    branches: [ main, master ]

  workflow_dispatch:

env:
  # CI packs the main package locally and tests THAT (no NuGet push required).
  LOCAL_PKG_VERSION: 0.0.0-ci

jobs:
  build:
    name: Cross-compile (${{ matrix.host.name }})
    runs-on: ${{ matrix.host.os }}
    strategy:
      fail-fast: false
      matrix:
        host:
          - name: Windows
            os: windows-latest
            rids: win-x64 win-arm64
          - name: Linux
            os: ubuntu-24.04
            rids: linux-x64 linux-arm64
          - name: macOS
            os: macos-latest
            rids: osx-arm64
            runrid: osx-arm64
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # NuGet.Config declares a local feed at ./artifacts; it must exist even
      # when empty, otherwise restore fails with NU1301.
      - name: Create local NuGet feed folder
        shell: bash
        run: mkdir -p artifacts

      - name: Pack PublishAotCross.Tools into the local feed
        shell: bash
        run: >
          dotnet pack src/PublishAotCross.Tools.nuproj
          -c Release -o artifacts --force
          -p:PublishAotCrossVersion=${{ env.LOCAL_PKG_VERSION }}

      - name: Cross-compile
        shell: bash
        run: |
          for rid in ${{ matrix.host.rids }}; do
            echo "::group::publish $rid"
            dotnet publish test/TestPublish/TestNupkg.csproj \
              -c Release -f net10.0 -r "$rid" -o "output/$rid" \
              -p:PublishAotCrossVersion=${{ env.LOCAL_PKG_VERSION }}
            echo "::endgroup::"
          done

      - name: Run binary (native hosts)
        if: matrix.host.runrid != ''
        shell: bash
        run: |
          chmod +x "output/${{ matrix.host.runrid }}/TestNupkg"
          "output/${{ matrix.host.runrid }}/TestNupkg"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.host.name }}-binaries
          path: output/**
          if-no-files-found: error

  # PoC: cross-compile osx-arm64 from a Windows host using the macOS SDK.
  cross_osx_arm64:
    name: Cross-compile osx-arm64 (Windows host)
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Create local NuGet feed folder
        shell: bash
        run: mkdir -p artifacts

      - name: Pack PublishAotCross.Tools into the local feed
        shell: bash
        run: >
          dotnet pack src/PublishAotCross.Tools.nuproj
          -c Release -o artifacts --force
          -p:PublishAotCrossVersion=${{ env.LOCAL_PKG_VERSION }}

      - name: Download and extract the macOS SDK
        shell: pwsh
        run: |
          $url = "https://github.com/joseluisq/macosx-sdks/releases/download/26.1/MacOSX26.1.sdk.tar.xz"
          $archive = Join-Path $env:RUNNER_TEMP "MacOSX26.1.sdk.tar.xz"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $extract = Join-Path $env:RUNNER_TEMP "macosx-sdk"
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          if (Get-Command 7z -ErrorAction SilentlyContinue) {
            & 7z x $archive "-o$extract" -y | Out-Null
            $tar = Get-ChildItem $extract -Filter *.tar | Select-Object -First 1
            & 7z x $tar.FullName "-o$extract" -y | Out-Null
          } else {
            tar -xf $archive -C $extract
          }
          $sdk = Get-ChildItem $extract -Directory -Recurse -Filter "*.sdk" | Select-Object -First 1
          if (-not $sdk) { throw "macOS SDK not found after extraction" }
          "MACOSX_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "MACOSX_SDK=$($sdk.FullName)"

      - name: Cross-compile osx-arm64
        shell: bash
        run: >
          dotnet publish test/TestPublish/TestNupkg.csproj
          -c Release -f net10.0 -r osx-arm64 -o output/osx-arm64
          -p:PublishAotCrossVersion=${{ env.LOCAL_PKG_VERSION }}

      - name: Verify Mach-O
        shell: pwsh
        run: |
          $b = [IO.File]::ReadAllBytes("output/osx-arm64/TestNupkg")[0..3]
          $magic = ($b | ForEach-Object { $_.ToString('x2') }) -join ''
          Write-Host "magic=$magic"
          if ($magic -notmatch '^(cffaedfe|cafebabe)') { throw "Not a Mach-O file (magic=$magic)" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: osx-arm64-cross
          path: output/osx-arm64/TestNupkg
          if-no-files-found: error

  run_osx_arm64:
    name: Run cross-built osx-arm64 (macOS)
    needs: cross_osx_arm64
    runs-on: macos-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: osx-arm64-cross
      - name: Run
        run: |
          chmod +x TestNupkg
          ./TestNupkg

  validate:
    name: Run linux-x64 binary
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: Linux-binaries

      - name: Run
        run: |
          chmod +x linux-x64/TestNupkg
          ./linux-x64/TestNupkg
