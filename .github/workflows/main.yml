name: CI

# ---------------------------------------------------------------------------
# Scope
#   Cross-compilation validation for PublishAotCross.Tools.
#
# Important constraints
#   * The XWin.Store.* package content (the filtered Windows SDK/CRT store) is
#     gitignored and is produced by maintainers with toolsets/download-xwin-store.ps1.
#     CI therefore CANNOT rebuild XWin.Store.* and validates cross-compilation
#     against the packages restored from the configured NuGet feeds.
#   * Consequently the PublishAotCross.Tools version referenced by the test
#     projects (0.6.0.<Revision>) and the matching XWin.Store.* / LLD.Link.Toolsets.*
#     versions must already be published for CI to run.
#
# Publishing
#   This workflow does NOT publish packages. Packing and pushing (NuGet.org /
#   GitHub Packages) is done manually by maintainers, once the toolset packages
#   for the current revision are available.
# ---------------------------------------------------------------------------

on:
  pull_request:
    branches: [ main, master ]

  workflow_dispatch:

jobs:
  build:
    name: Cross-compile (${{ matrix.host.name }})
    runs-on: ${{ matrix.host.os }}
    strategy:
      fail-fast: false
      matrix:
        host:
          - name: Windows
            os: windows-latest
            rids: win-x64 win-arm64
          - name: Linux
            os: ubuntu-24.04
            rids: linux-x64 linux-arm64
          - name: macOS
            os: macos-latest
            rids: osx-arm64
            runrid: osx-arm64
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # NuGet.Config declares a local feed at ./artifacts; it must exist even
      # when empty, otherwise restore fails with NU1301.
      - name: Create local NuGet feed folder
        shell: bash
        run: mkdir -p artifacts

      - name: Cross-compile
        shell: bash
        run: |
          for rid in ${{ matrix.host.rids }}; do
            echo "::group::publish $rid"
            dotnet publish test/TestPublish/TestNupkg.csproj \
              -c Release -f net10.0 -r "$rid" -o "output/$rid"
            echo "::endgroup::"
          done

      - name: Run binary (native hosts)
        if: matrix.host.runrid != ''
        shell: bash
        run: |
          chmod +x "output/${{ matrix.host.runrid }}/TestNupkg"
          "output/${{ matrix.host.runrid }}/TestNupkg"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.host.name }}-binaries
          path: output/**
          if-no-files-found: error

  validate:
    name: Run linux-x64 binary
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: Linux-binaries

      - name: Run
        run: |
          chmod +x linux-x64/TestNupkg
          ./linux-x64/TestNupkg
