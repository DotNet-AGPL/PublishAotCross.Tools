name: CI

# ---------------------------------------------------------------------------
# Scope
#   Cross-compilation validation for PublishAotCross.Tools.
#
# Important constraints
#   * The XWin.Store.* / LLD.Link.Toolsets.* package contents are gitignored and
#     produced by maintainers, so CI REBUILDS only the MacOSX.SDK package (from a
#     downloaded SDK) and the main package; the others are restored from the feeds.
#   * The main PublishAotCross.Tools package is built by CI from source (packed
#     into the local ./artifacts feed under a synthetic version), so no NuGet push
#     is needed to validate changes.
#
# Publishing
#   This workflow does NOT publish packages. Packing and pushing (NuGet.org /
#   GitHub Packages) is done manually by maintainers.
# ---------------------------------------------------------------------------

on:
  pull_request:
    branches: [ main, master ]

  workflow_dispatch:

env:
  # CI packs the main package locally and tests THAT (no NuGet push required).
  LOCAL_PKG_VERSION: 0.0.0-ci

jobs:
  # Build the MacOSX.SDK package once and share it with the jobs that need it.
  sdk:
    name: Build MacOSX.SDK
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Fetch and filter the macOS SDK
        shell: pwsh
        run: ./toolsets/download-macosx-sdk.ps1 -AcceptLicense

      - name: Pack MacOSX.SDK
        shell: pwsh
        run: dotnet pack toolsets/MacOSX.SDK/MacOSX.SDK.nuproj -c Release -o artifacts --force

      - name: Upload MacOSX.SDK package
        uses: actions/upload-artifact@v4
        with:
          name: macosx-sdk-nupkg
          path: artifacts/MacOSX.SDK.*.nupkg
          if-no-files-found: error

  build:
    name: Cross-compile (${{ matrix.host.name }})
    needs: sdk
    runs-on: ${{ matrix.host.os }}
    strategy:
      fail-fast: false
      matrix:
        host:
          - name: Windows
            os: windows-latest
            rids: win-x64 win-arm64
          - name: Linux
            os: ubuntu-24.04
            rids: linux-x64 linux-arm64
          - name: macOS
            os: macos-latest
            rids: osx-arm64
            runrid: osx-arm64
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # NuGet.Config declares a local feed at ./artifacts; it must exist even
      # when empty, otherwise restore fails with NU1301.
      - name: Create local NuGet feed folder
        shell: bash
        run: mkdir -p artifacts

      - name: Download MacOSX.SDK into the local feed
        uses: actions/download-artifact@v4
        with:
          name: macosx-sdk-nupkg
          path: artifacts

      - name: Pack PublishAotCross.Tools into the local feed
        shell: bash
        run: >
          dotnet pack src/PublishAotCross.Tools.nuproj
          -c Release -o artifacts --force
          -p:PublishAotCrossVersion=${{ env.LOCAL_PKG_VERSION }}

      - name: Cross-compile
        shell: bash
        run: |
          for rid in ${{ matrix.host.rids }}; do
            echo "::group::publish $rid"
            dotnet publish test/TestPublish/TestNupkg.csproj \
              -c Release -f net10.0 -r "$rid" -o "output/$rid" \
              -p:PublishAotCrossVersion=${{ env.LOCAL_PKG_VERSION }}
            echo "::endgroup::"
          done

      - name: Run binary (native hosts)
        if: matrix.host.runrid != ''
        shell: bash
        run: |
          chmod +x "output/${{ matrix.host.runrid }}/TestNupkg"
          "output/${{ matrix.host.runrid }}/TestNupkg"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.host.name }}-binaries
          path: output/**
          if-no-files-found: error

  # Cross-compile osx-arm64 from a Windows host. The macOS SDK subset is provided
  # automatically by the MacOSX.SDK package (built by the "sdk" job; no NuGet push).
  cross_osx_arm64:
    name: Cross-compile osx-arm64 (Windows host)
    needs: sdk
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Create local NuGet feed folder
        shell: bash
        run: mkdir -p artifacts

      - name: Download MacOSX.SDK into the local feed
        uses: actions/download-artifact@v4
        with:
          name: macosx-sdk-nupkg
          path: artifacts

      - name: Pack PublishAotCross.Tools into the local feed
        shell: bash
        run: >
          dotnet pack src/PublishAotCross.Tools.nuproj
          -c Release -o artifacts --force
          -p:PublishAotCrossVersion=${{ env.LOCAL_PKG_VERSION }}

      - name: Cross-compile osx-arm64
        shell: bash
        run: >
          dotnet publish test/TestPublish/TestNupkg.csproj
          -c Release -f net10.0 -r osx-arm64 -o output/osx-arm64
          -p:PublishAotCrossVersion=${{ env.LOCAL_PKG_VERSION }}

      - name: Verify Mach-O
        shell: pwsh
        run: |
          $b = [IO.File]::ReadAllBytes("output/osx-arm64/TestNupkg")[0..3]
          $magic = ($b | ForEach-Object { $_.ToString('x2') }) -join ''
          Write-Host "magic=$magic"
          if ($magic -notmatch '^(cffaedfe|cafebabe)') { throw "Not a Mach-O file (magic=$magic)" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: osx-arm64-cross
          path: output/osx-arm64/TestNupkg
          if-no-files-found: error

  run_osx_arm64:
    name: Run cross-built osx-arm64 (macOS)
    needs: cross_osx_arm64
    runs-on: macos-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: osx-arm64-cross
      - name: Run
        run: |
          chmod +x TestNupkg
          ./TestNupkg

  validate:
    name: Run linux-x64 binary
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: Linux-binaries

      - name: Run
        run: |
          chmod +x linux-x64/TestNupkg
          ./linux-x64/TestNupkg
