name: Fetch llvm-objcopy

# ---------------------------------------------------------------------------
# Maintainer utility (manual only).
#
# Downloads the multi-format `llvm-objcopy` for every supported host from the
# official LLVM release assets and uploads the extracted binaries as an
# artifact. Run this when bumping LLDVersion, then commit the binaries into
# src/build/llvm-objcopy/<host-rid>/ (see that folder's README.md).
#
# This is deliberately a separate workflow from the main CI so it never runs on
# pull requests / pushes.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      version:
        description: LLVM version (defaults to LLDVersion in toolsets/ToolsetsVersion.props)
        required: false
        type: string

jobs:
  fetch:
    name: Fetch llvm-objcopy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Determine LLVM version
        shell: bash
        run: |
          set -euo pipefail
          v="${{ inputs.version }}"
          if [ -z "$v" ]; then
            v=$(grep -oP '(?<=<LLDVersion>)[^<]+' toolsets/ToolsetsVersion.props | head -1)
          fi
          [ -n "$v" ] || { echo "could not determine LLVM version"; exit 1; }
          echo "LLVM_VERSION=$v" >> "$GITHUB_ENV"
          echo "Using LLVM $v"

      - name: Install zstd
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd

      - name: Fetch and extract llvm-objcopy
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}"
          out="$PWD/out"
          mkdir -p "$out/linux-x64" "$out/linux-arm64" "$out/osx-arm64" "$out/win-x64"

          fetch() {
            local rid="$1" asset="$2" member="$3" dest="$4"
            echo "::group::fetch $rid ($asset)"
            curl -fL --retry 5 --retry-delay 5 -o "/tmp/$rid.tar.zst" "$base/$asset"
            local x="/tmp/x-$rid"; rm -rf "$x"; mkdir -p "$x"
            tar --zstd -xf "/tmp/$rid.tar.zst" -C "$x" --wildcards "$member"
            local src; src="$(find "$x" -type f -name "$(basename "$dest")" | head -1)"
            [ -n "$src" ] || { echo "not found: $member in $asset"; exit 1; }
            cp "$src" "$out/$rid/$dest"
            chmod +x "$out/$rid/$dest"
            file "$out/$rid/$dest" || true
            ls -l "$out/$rid/$dest"
            rm -rf "$x" "/tmp/$rid.tar.zst"
            echo "::endgroup::"
          }

          fetch linux-x64   "LLVM-${LLVM_VERSION}-Linux-X64.tar.zst"        '*/bin/llvm-objcopy'     llvm-objcopy
          fetch linux-arm64 "LLVM-${LLVM_VERSION}-Linux-ARM64.tar.zst"      '*/bin/llvm-objcopy'     llvm-objcopy
          fetch osx-arm64   "LLVM-${LLVM_VERSION}-macOS-ARM64.tar.zst"      '*/bin/llvm-objcopy'     llvm-objcopy
          fetch win-x64     "clang+llvm-${LLVM_VERSION}-x86_64-pc-windows-msvc.tar.zst" '*/bin/llvm-objcopy.exe' llvm-objcopy.exe

          # Windows arm64 hosts reuse the x64 build (runs via emulation).
          mkdir -p "$out/win-arm64"
          cp "$out/win-x64/llvm-objcopy.exe" "$out/win-arm64/llvm-objcopy.exe"

      - name: Show results
        shell: bash
        run: |
          set -euo pipefail
          find out -type f -printf '%p  %s bytes\n' | sort

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llvm-objcopy-${{ env.LLVM_VERSION }}
          path: out/**
          if-no-files-found: error
